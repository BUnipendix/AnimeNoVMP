name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build
        run: cmake --build build -j2
      - name: Smoke
        run: |
          test -x build/NoVmp/AnimeNoVMP
          test -x build/vtildump/vtildump
          test -x build/supervisor/novmp-run
          python3 tools/vmscan.py --help > /dev/null
          python3 tools/summarize.py --help > /dev/null
